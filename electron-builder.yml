appId: com.sbemulatormanager.app
productName: SB Emulator Manager
directories:
  output: dist
files:
  # `dir/**` (not `dir/*`) — the single-star form only excludes immediate children, which
  # silently shipped all nested sources inside the packaged app.
  - '!**/.vscode/**'
  - '!src/**'
  - '!electron.vite.config.*'
  - '!tsconfig*.json'
  - '!vitest*.config.ts'
  - '!biome.json'
  - '!components.json'
  - '!{docker,scripts,tests,plan}/**'
# No custom icons exist in the repo — electron-builder falls back to its own default icon
# on both platforms. Adding real branded icons is a separate, design-driven task.
# Signing/notarization are intentionally left unset: an unsigned .exe trips SmartScreen and
# an unsigned .dmg/.app trips Gatekeeper (right-click → Open, or `xattr -cr` on first
# launch). Expected and acceptable for a personal tool.
mac:
  target: dmg
  category: public.app-category.developer-tools
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
