appId: com.sbemulatormanager.app
productName: SB Emulator Manager
directories:
  output: dist
files:
  # `dir/**` (not `dir/*`) — the single-star form only excludes immediate children, which
  # silently shipped all nested sources inside the packaged app.
  - '!**/.vscode/**'
  - '!src/**'
  - '!electron.vite.config.*'
  - '!tsconfig*.json'
  - '!vitest*.config.ts'
  - '!biome.json'
  - '!components.json'
  - '!{docker,scripts,tests,plan}/**'
